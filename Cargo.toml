[workspace]
resolver = "2"
members = [
    "crates/beacon-api",
    "crates/beacon-core",
    "crates/beacon-db",
    "crates/crypto-stub",
    "crates/paschal-cli",
    "crates/paschal-transform",
    "crates/blob-store",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
authors = ["Paschal contributors"]
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Test deps (used via dev-dependencies)
proptest = "1"
tempfile = "3"
http-body-util = "0.1"
# Async runtime + HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "net"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["trace", "cors", "fs", "limit", "request-id", "timeout"] }
hyper = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Errors
thiserror = "2"
anyhow = "1"

# Crypto (stub)
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
subtle = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }

# Internal
beacon-core = { path = "crates/beacon-core" }
beacon-db = { path = "crates/beacon-db" }
crypto-stub = { path = "crates/crypto-stub" }
paschal-transform = { path = "crates/paschal-transform" }
blob-store = { path = "crates/blob-store" }

# AWS SDK (optional cloud blob + KMS backends, pulled in via the `aws` feature
# on blob-store and crypto-stub). The self-hosted Docker build runs the local
# file-backed backends by default and never reaches AWS.
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Embedded static assets
include_dir = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
