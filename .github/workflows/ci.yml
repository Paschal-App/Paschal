name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # include_dir! in beacon-api/src/spa.rs embeds the SvelteKit build at
      # compile time and panics if the directory is absent. Create a stub so
      # clippy passes without a full frontend build in the Rust-only CI job.
      - name: Create SPA stub directory
        run: mkdir -p apps/principal/build

      - name: fmt
        id: fmt
        run: cargo fmt --all --check

      # Run clippy and tests even when fmt fails so the summary shows the full picture.
      - name: clippy
        id: clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        id: test
        if: always()
        run: cargo test --workspace 2>&1 | tee /tmp/cargo-test.txt

      - name: Job summary
        if: always()
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          {
            echo "## 🦀 Rust"
            echo ""
            echo "| | Check | Result |"
            echo "| --- | --- | --- |"
            echo "| $(icon "${{ steps.fmt.outcome }}") | **rustfmt** | \`${{ steps.fmt.outcome }}\` |"
            echo "| $(icon "${{ steps.clippy.outcome }}") | **clippy** | \`${{ steps.clippy.outcome }}\` |"
            echo "| $(icon "${{ steps.test.outcome }}") | **cargo test** | \`${{ steps.test.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f /tmp/cargo-test.txt ]]; then
            PASSED=$(grep -oP '\d+(?= passed)'  /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            FAILED=$(grep -oP '\d+(?= failed)'  /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            IGNORED=$(grep -oP '\d+(?= ignored)' /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            {
              echo ""
              if [[ "$FAILED" -gt 0 ]]; then
                echo "> ❌ **$PASSED passed · $FAILED failed** · $IGNORED ignored"
              else
                echo "> ✅ **$PASSED tests passed** · $IGNORED ignored"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (typecheck · Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/principal
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/principal/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte type-check
        id: typecheck
        run: pnpm check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for dev server
        run: npx --yes wait-on http://localhost:5173 --timeout 30000

      - name: Playwright tests (mocked)
        id: playwright
        run: npx playwright test --project=chromium 2>&1 | tee /tmp/pw-output.txt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/principal/playwright-report/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          {
            echo "## 🌐 Frontend"
            echo ""
            echo "| | Check | Result |"
            echo "| --- | --- | --- |"
            echo "| $(icon "${{ steps.typecheck.outcome }}") | **svelte-check** | \`${{ steps.typecheck.outcome }}\` |"
            echo "| $(icon "${{ steps.playwright.outcome }}") | **Playwright** | \`${{ steps.playwright.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Playwright's list reporter prints a summary line at the end:
          # "  45 passed (38s)" or "  43 passed, 2 failed (38s)"
          if [[ -f /tmp/pw-output.txt ]]; then
            PW_LINE=$(grep -E "^\s+[0-9]" /tmp/pw-output.txt \
              | grep -E "(passed|failed|skipped)" \
              | tail -1 || true)
            if [[ -n "$PW_LINE" ]]; then
              PASSED=$(echo  "$PW_LINE" | grep -oP '\d+(?= passed)'  || echo "0")
              FAILED=$(echo  "$PW_LINE" | grep -oP '\d+(?= failed)'  || echo "0")
              SKIPPED=$(echo "$PW_LINE" | grep -oP '\d+(?= skipped)' || echo "0")
              DURATION=$(echo "$PW_LINE" | grep -oP '\(\S+\)' | head -1 || echo "")
              {
                echo ""
                if [[ "$FAILED" -gt 0 ]]; then
                  echo "> ❌ **$PASSED passed · $FAILED failed** · $SKIPPED skipped $DURATION"
                else
                  echo "> ✅ **$PASSED tests passed** · $SKIPPED skipped $DURATION"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  security:
    name: Security (OWASP Top 10)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the GitHub Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pre-built cargo-audit binary — no Rust compilation needed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/principal/pnpm-lock.yaml
      - name: Install JS dependencies
        working-directory: apps/principal
        run: pnpm install --frozen-lockfile

      # ── A01–A10 · Semgrep static analysis ──────────────────────────────────
      # continue-on-error keeps the job green so findings don't block merges;
      # remove it once the initial backlog is cleared.
      - name: Semgrep OWASP Top 10
        id: semgrep
        continue-on-error: true
        run: |
          pip install semgrep --quiet
          set +e
          semgrep --config p/owasp-top-ten --sarif --output semgrep.sarif . 2>/dev/null
          EC=$?
          set -e
          echo "findings=$(jq '.runs[0].results | length' semgrep.sarif 2>/dev/null || echo 0)" \
            >> "$GITHUB_OUTPUT"
          exit $EC

      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-owasp-top-ten

      # ── A06 · cargo audit (Rust dependencies) ──────────────────────────────
      - name: cargo audit
        id: cargo_audit
        continue-on-error: true
        run: |
          set +e
          cargo audit --json 2>/dev/null > /tmp/cargo-audit.json
          EC=$?
          set -e
          echo "vulns=$(jq '.vulnerabilities.count // 0' /tmp/cargo-audit.json 2>/dev/null || echo 0)" \
            >> "$GITHUB_OUTPUT"
          exit $EC

      # ── A06 · pnpm audit (JS dependencies) ─────────────────────────────────
      - name: pnpm audit
        id: pnpm_audit
        continue-on-error: true
        working-directory: apps/principal
        run: |
          set +e
          pnpm audit --json 2>/dev/null > /tmp/pnpm-audit.json
          EC=$?
          set -e
          echo "vulns=$(jq '.metadata.vulnerabilities.total // 0' /tmp/pnpm-audit.json 2>/dev/null || echo 0)" \
            >> "$GITHUB_OUTPUT"
          exit $EC

      - name: Job summary
        if: always()
        run: |
          SEMGREP="${{ steps.semgrep.outputs.findings }}"
          CARGO="${{ steps.cargo_audit.outputs.vulns }}"
          PNPM="${{ steps.pnpm_audit.outputs.vulns }}"

          badge() { [[ "${1:-0}" -eq 0 ]] && echo "✅" || echo "⚠️"; }

          {
            echo "## 🔒 Security — OWASP Top 10"
            echo ""
            echo "| | Scanner | Coverage | Findings |"
            echo "| --- | --- | --- | ---: |"
            echo "| $(badge "$SEMGREP") | **Semgrep** \`p/owasp-top-ten\` | A01–A10 static analysis | ${SEMGREP:-0} |"
            echo "| $(badge "$CARGO")  | **cargo audit**                 | A06 · Rust deps         | ${CARGO:-0} |"
            echo "| $(badge "$PNPM")   | **pnpm audit**                  | A06 · JS deps           | ${PNPM:-0} |"
            echo ""
            echo "_Semgrep findings are also filed as [code scanning alerts](https://github.com/${{ github.repository }}/security/code-scanning)._"
          } >> "$GITHUB_STEP_SUMMARY"
