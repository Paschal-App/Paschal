name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        id: fmt
        run: cargo fmt --all --check

      # Run clippy and tests even when fmt fails so the summary shows the full picture.
      - name: clippy
        id: clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        id: test
        if: always()
        run: cargo test --workspace 2>&1 | tee /tmp/cargo-test.txt

      - name: Job summary
        if: always()
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          {
            echo "## 🦀 Rust"
            echo ""
            echo "| | Check | Result |"
            echo "| --- | --- | --- |"
            echo "| $(icon "${{ steps.fmt.outcome }}") | **rustfmt** | \`${{ steps.fmt.outcome }}\` |"
            echo "| $(icon "${{ steps.clippy.outcome }}") | **clippy** | \`${{ steps.clippy.outcome }}\` |"
            echo "| $(icon "${{ steps.test.outcome }}") | **cargo test** | \`${{ steps.test.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f /tmp/cargo-test.txt ]]; then
            PASSED=$(grep -oP '\d+(?= passed)'  /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            FAILED=$(grep -oP '\d+(?= failed)'  /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            IGNORED=$(grep -oP '\d+(?= ignored)' /tmp/cargo-test.txt | awk '{s+=$1} END {print s+0}')
            {
              echo ""
              if [[ "$FAILED" -gt 0 ]]; then
                echo "> ❌ **$PASSED passed · $FAILED failed** · $IGNORED ignored"
              else
                echo "> ✅ **$PASSED tests passed** · $IGNORED ignored"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (typecheck · Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/principal
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/principal/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte type-check
        id: typecheck
        run: pnpm check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for dev server
        run: npx --yes wait-on http://localhost:5173 --timeout 30000

      - name: Playwright tests (mocked)
        id: playwright
        run: npx playwright test --project=chromium 2>&1 | tee /tmp/pw-output.txt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/principal/playwright-report/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❓" ;;
            esac
          }

          {
            echo "## 🌐 Frontend"
            echo ""
            echo "| | Check | Result |"
            echo "| --- | --- | --- |"
            echo "| $(icon "${{ steps.typecheck.outcome }}") | **svelte-check** | \`${{ steps.typecheck.outcome }}\` |"
            echo "| $(icon "${{ steps.playwright.outcome }}") | **Playwright** | \`${{ steps.playwright.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Playwright's list reporter prints a summary line at the end:
          # "  45 passed (38s)" or "  43 passed, 2 failed (38s)"
          if [[ -f /tmp/pw-output.txt ]]; then
            PW_LINE=$(grep -E "^\s+[0-9]" /tmp/pw-output.txt \
              | grep -E "(passed|failed|skipped)" \
              | tail -1 || true)
            if [[ -n "$PW_LINE" ]]; then
              PASSED=$(echo  "$PW_LINE" | grep -oP '\d+(?= passed)'  || echo "0")
              FAILED=$(echo  "$PW_LINE" | grep -oP '\d+(?= failed)'  || echo "0")
              SKIPPED=$(echo "$PW_LINE" | grep -oP '\d+(?= skipped)' || echo "0")
              DURATION=$(echo "$PW_LINE" | grep -oP '\(\S+\)' | head -1 || echo "")
              {
                echo ""
                if [[ "$FAILED" -gt 0 ]]; then
                  echo "> ❌ **$PASSED passed · $FAILED failed** · $SKIPPED skipped $DURATION"
                else
                  echo "> ✅ **$PASSED tests passed** · $SKIPPED skipped $DURATION"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
