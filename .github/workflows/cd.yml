name: CD

# Runs on every push to main. Re-runs the full CI suite first, then builds and
# pushes the Docker image, spins it up on the runner, and runs the Playwright
# smoke suite against the live local instance.
on:
  push:
    branches: [main]

# One deployment at a time — don't cancel in-progress runs.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ── 1. CI ──────────────────────────────────────────────────────────────────
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  # ── 2. Build & push image ──────────────────────────────────────────────────
  publish:
    name: Build & push Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The short SHA tag, e.g. "sha-abc1234", used downstream.
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/paschal-app/paschal
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache — keeps rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Smoke — spin up on the runner itself ─────────────────────────────────
  #
  # Pulls the freshly-published image, starts Beacon + Postgres on the runner,
  # and runs the Playwright chromium-live suite against http://localhost:8080.
  # No SSH keys, no external secrets, no production involved.
  smoke:
    name: Smoke — runner deployment
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paschal
          POSTGRES_PASSWORD: paschal
          POSTGRES_DB: paschal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Beacon
        run: |
          docker run -d \
            --name beacon \
            --network host \
            -e DATABASE_URL=postgresql://paschal:paschal@localhost:5432/paschal \
            -e BEACON_PUBLIC_BASE_URL=http://localhost:8080 \
            ghcr.io/paschal-app/paschal:${{ needs.publish.outputs.image_tag }}

      - name: Wait for Beacon to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/livez; then
              echo "Beacon is up"
              exit 0
            fi
            echo "Waiting… ($i/30)"
            sleep 2
          done
          echo "Beacon did not start in time — logs:"
          docker logs beacon
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/principal/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/principal
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/principal
        run: npx playwright install chromium --with-deps

      - name: Run smoke suite
        working-directory: apps/principal
        run: npx playwright test --project=chromium-live
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - name: Beacon logs on failure
        if: failure()
        run: docker logs beacon

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: apps/principal/playwright-report/
          retention-days: 7
